<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 250px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #18181b; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      #status { color: #71717a; margin-bottom: 12px; min-height: 1.4em; }
      button { width: 100%; padding: 8px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #toggle { background: #18181b; color: #fff; }
      #toggle.stop { background: #e11d48; }
      #options { margin-top: 8px; background: #f4f4f5; color: #18181b; }
    </style>
  </head>
  <body>
    <h1>MAYAMI</h1>
    <div id="status">Idle</div>
    <button id="toggle">Start on this tab</button>
    <button id="options">Settings &amp; profile</button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
